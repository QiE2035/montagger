<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>montagger</title>
<link rel="stylesheet" href="/static/main.css">
<script src="/static/vendor/htmx.min.js"></script>
<script src="/static/vendor/sse.js"></script>
<script src="/static/main.js"></script>
{% block head %}{% endblock %}
</head>
<body hx-headers='{"X-Montagger": "{{ csrf }}" }'>
<header class="topbar">
  <a class="brand" href="/">montagger<span class="brand-dot">.</span></a>
  <nav class="nav">
    <a href="/" {{ 'class="active"' if active_nav == 'dashboard' }}>dashboard</a>
    <a href="/settings" {{ 'class="active"' if active_nav == 'settings' }}>settings</a>
  </nav>
  <div class="topbar-right">
    <div id="pair-light"
         hx-get="/api/pair-light"
         hx-trigger="every 5s"
         hx-swap="innerHTML"
         hx-target="this">
      {% include "partials/pair_light.html" %}
    </div>
  </div>
</header>
<main class="container">
{% block content %}{% endblock %}
</main>
<footer class="footer">montagger v{{ version }} &middot; {{ stats.total if stats else 0 }} tasks tracked</footer>
<dialog id="confirm-dialog">
  <p id="confirm-dialog-msg"></p>
  <p id="confirm-dialog-detail" class="hint"></p>
  <div class="dialog-actions">
    <button type="button" id="confirm-dialog-cancel" class="btn">cancel</button>
    <button type="button" id="confirm-dialog-ok" class="btn">ok</button>
  </div>
</dialog>
</body>
</html>
